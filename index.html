<style>
  :root{
    --bg:#0B0D1F;
    --bg-alt:#10122A;
    --surface:#151833;
    --surface-2:#1C1F42;
    --line:#2C2F5A;
    --text:#F1F2F9;
    --muted:#8D90B3;
    --saffron:#F0A93E;
    --saffron-dim:#332507;
    --teal:#2BC4B0;
    --teal-dim:#0C2E29;
    --danger:#F26B6B;
    --success:#3ECF8E;
    --radius:16px;
    --font-display:'Sora',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(240,169,62,0.07), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(43,196,176,0.06), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}
  button:focus-visible, a:focus-visible, input:focus-visible{outline:2px solid var(--saffron); outline-offset:2px;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:40;
    background:rgba(18,20,43,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .brand-mark{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(135deg, var(--saffron), #ffcf6b);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; color:#1a1400; font-size:13px; letter-spacing:0.3px;
  }
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:0.2px;}
  .brand-sub{font-size:10px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase;}
  .header-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--muted);
    border:1px solid var(--line);
  }
  .icon-btn:hover{color:var(--text); border-color:var(--saffron);}

  main{max-width:960px; margin:0 auto; padding:20px 16px 112px;}
  .app-loading{min-height:62vh;display:flex;align-items:center;justify-content:center;padding:40px 18px;}
  .loading-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;}
  .loading-spinner{width:28px;height:28px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--saffron);border-radius:50%;animation:acbSpin .8s linear infinite;}
  .loading-title{font-family:var(--font-display);font-weight:700;font-size:15px;}
  .loading-sub{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5;}
  @keyframes acbSpin{to{transform:rotate(360deg)}}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:rgba(7,9,22,.97); backdrop-filter:blur(16px);
    border-top:1px solid rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1 1 0; min-width:0; max-width:none; height:56px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:#8f94aa; background:rgba(24,27,54,.92); border:1px solid rgba(255,255,255,.08);
    font-size:9px; font-weight:700; padding:4px 2px; border-radius:13px;
    white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.04) inset;
    transition:transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .nav-btn:active{transform:translateY(1px);}
  .nav-btn.active{color:#fff; background:rgba(240,169,62,.14); border-color:rgba(240,169,62,.45); box-shadow:0 0 0 1px rgba(240,169,62,.10) inset, 0 3px 12px rgba(0,0,0,.22);}
  .nav-btn svg{display:block; width:23px; height:23px; flex:0 0 auto;}
  @media (max-width:390px){
    .bottom-nav{gap:5px;padding-left:6px;padding-right:6px;}
    .nav-btn{height:54px;border-radius:12px;font-size:8.5px;}
    .nav-btn svg{width:22px;height:22px;}
  }

  /* ---------- Purchases page ---------- */
  .purchase-row{
    display:flex; align-items:center; gap:12px; background:var(--surface);
    border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px;
  }
  .purchase-thumb{
    width:48px; height:48px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:11px; color:rgba(0,0,0,0.7);
  }
  .purchase-info{flex:1; min-width:0;}
  .purchase-info .t{font-weight:700; font-size:13.5px; margin-bottom:2px;}
  .purchase-info .s{font-size:11.5px; color:var(--muted);}
  .empty-state{text-align:center; padding:60px 20px; color:var(--muted);}
  .empty-state svg{margin-bottom:14px; opacity:0.5;}
  .empty-state p{font-size:13.5px; line-height:1.6;}

  /* ---------- Support page ---------- */
  .support-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:14px;
  }
  .support-card h4{font-family:var(--font-display); font-size:14.5px; margin-bottom:6px;}
  .support-card p{font-size:12.5px; color:var(--muted); line-height:1.6; margin-bottom:14px;}
  .support-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:12px; border-radius:11px; font-weight:700; font-size:13.5px;
  }
  .support-btn.msg{background:var(--saffron); color:#221900;}
  .support-btn.msg:hover{filter:brightness(1.08);}
  .support-btn.tg{background:#229ED9; color:#fff;}
  .message-status{font-size:12px; color:var(--muted); text-align:center; margin-top:8px; line-height:1.5;}
  .admin-message{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px;}
  .admin-message strong{font-size:13px;}
  .admin-message .meta{font-size:10.5px; color:var(--muted); margin:4px 0 8px;}
  .admin-message .body{font-size:12.5px; color:var(--text); line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere;}
  .admin-message .msg-del{margin-top:9px; color:var(--danger); font-size:12px; font-weight:600;}
  .faq-item{border-bottom:1px solid var(--line); padding:14px 2px;}
  .faq-item:last-child{border-bottom:none;}
  .faq-item .q{font-weight:600; font-size:13px; margin-bottom:5px;}
  .faq-item .a{font-size:12px; color:var(--muted); line-height:1.55;}

  /* ---------- Home: two ticket tiles ---------- */
  .hero{padding:18px 4px 26px;}
  .hero-eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:2px; color:var(--saffron);
    text-transform:uppercase; margin-bottom:8px;
  }
  .hero h1{font-family:var(--font-display); font-size:28px; line-height:1.25; font-weight:800; margin-bottom:8px;}
  .hero p{color:var(--muted); font-size:14.5px; max-width:46ch;}

  /* ---------- Search bar ---------- */
  .search-bar{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:13px 16px; margin:4px 4px 22px; color:var(--muted); font-size:14px;
  }

  /* ---------- Two shortcut boxes (Batches / Books) ---------- */
  .shortcut-row{display:flex; gap:14px; margin:0 4px 30px;}
  .shortcut{
    flex:1; background:#FFFFFF; border:1px solid var(--line); border-radius:18px;
    padding:20px 10px 16px; display:flex; flex-direction:column; align-items:center; gap:10px;
    transition:transform .15s ease, border-color .15s ease; text-align:center;
  }
  .shortcut:hover{transform:translateY(-2px);}
  .shortcut-icon{
    width:50px; height:50px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .shortcut.batches{border-color:rgba(240,169,62,0.35);}
  .shortcut.batches .shortcut-icon{background:var(--saffron-dim); color:var(--saffron);}
  .shortcut.books{border-color:rgba(43,196,176,0.35);}
  .shortcut.books .shortcut-icon{background:var(--teal-dim); color:var(--teal);}
  .shortcut-label{font-family:var(--font-display); font-weight:700; font-size:14.5px; color:#171933;}
  .shortcut-sub{font-size:11px; color:#6b7094;}

  /* ---------- Welcome banner ---------- */
  .welcome{
    text-align:center; padding:30px 22px 32px; margin:0 4px 30px;
    background:linear-gradient(180deg, rgba(240,169,62,0.07), rgba(43,196,176,0.04));
    border:1px solid var(--line); border-radius:20px;
  }
  .welcome-badge{
    width:46px; height:46px; border-radius:50%; margin:0 auto 16px;
    background:linear-gradient(135deg,var(--saffron),#ffd98a);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .welcome h1{
    font-family:var(--font-display); font-weight:800; font-size:19px; line-height:1.35;
    margin-bottom:10px;
  }
  .welcome h1 span{color:var(--saffron);}
  .welcome p{
    font-size:13.5px; color:var(--muted); line-height:1.6; max-width:34ch; margin:0 auto;
  }

  /* ---------- How to buy guide ---------- */
  .how-to-buy{
    display:flex; align-items:center; gap:5px; margin-top:8px;
    font-size:11.5px; color:var(--teal); font-weight:600; background:none; border:none; padding:0;
  }
  .how-to-buy:hover{text-decoration:underline;}

  /* ---------- Home feed sections (horizontal scroll) ---------- */
  .feed-section{margin-bottom:28px;}
  .feed-head{display:flex; align-items:center; justify-content:space-between; padding:0 4px 12px;}
  .feed-head h3{font-family:var(--font-display); font-size:15.5px; font-weight:700;}
  .feed-head a{font-size:12.5px; font-weight:600; color:var(--saffron);}
  .feed-head.books-head a{color:var(--teal);}
  .h-scroll{display:flex; gap:12px; overflow-x:auto; padding:2px 4px 8px; scrollbar-width:none;}
  .h-scroll::-webkit-scrollbar{display:none;}
  .mini-card{
    min-width:152px; max-width:152px; flex-shrink:0;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;
  }
  .mini-body{padding:10px 10px 12px; display:flex; flex-direction:column; gap:6px;}
  .mini-title{font-size:12.5px; font-weight:700; line-height:1.3; font-family:var(--font-display);}
  .mini-price{font-family:var(--font-mono); font-size:17px; font-weight:700; color:var(--saffron);}

  /* ---------- Section header on list pages ---------- */
  .section-head{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .back-btn{
    width:34px; height:34px; border-radius:9px; background:var(--surface);
    border:1px solid var(--line); color:var(--muted); display:flex; align-items:center; justify-content:center;
  }
  .back-btn:hover{color:var(--text);}
  .section-head h2{font-family:var(--font-display); font-size:20px; font-weight:700;}
  .section-head span{display:block; font-size:12.5px; color:var(--muted); font-weight:400; margin-top:2px;}

  /* ---------- Item cards ---------- */
  .card-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){ .card-grid{grid-template-columns:1fr;} }

  .item-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .item-banner{
    position:relative; height:auto; aspect-ratio:3/4; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface-2);
    font-family:var(--font-display); font-weight:800; font-size:15px; text-align:center; padding:0;
    color:rgba(0,0,0,0.75);
  }
  .poster-gallery{
    width:100%; height:100%; display:flex; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; scrollbar-width:none;
    /* Horizontal swipes change poster; vertical swipes are handed to the page. */
    touch-action:pan-x pan-y;
    overscroll-behavior-x:contain;
  }
  .poster-gallery::-webkit-scrollbar{display:none;}
  .poster-slide{
    min-width:100%; width:100%; height:100%; flex:0 0 100%;
    display:flex; align-items:center; justify-content:center;
    scroll-snap-align:start; background:#fff;
  }
  .poster-slide img{
    width:100%; height:100%; object-fit:contain; display:block;
    touch-action:pan-x pan-y;
  }
  .poster-dots{
    position:absolute; left:0; right:0; bottom:8px; display:flex;
    justify-content:center; gap:5px; pointer-events:none;
  }
  .poster-dot{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.75); border:1px solid rgba(0,0,0,.25);}
  .poster-dot.active{background:var(--saffron);}
  .mini-banner{
    position:relative; height:auto; aspect-ratio:3/4; overflow:hidden;
    display:flex; align-items:center; justify-content:center; padding:0;
    background:var(--surface-2);
  }
  /* Batches use a wide 16:9 thumbnail poster instead of the tall 3:4 book
     cover shape — books are left untouched. */
  .item-banner.kind-batches, .mini-banner.kind-batches{ aspect-ratio:16/9; }
  .mini-banner .poster-gallery{height:100%;}
  .mini-banner .poster-slide img{object-fit:contain;}
  .item-body{padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
  .item-tag{
    align-self:flex-start; font-family:var(--font-mono); font-size:10px; letter-spacing:0.5px;
    padding:3px 8px; border-radius:20px; background:var(--surface-2); color:var(--muted);
  }
  .item-title{font-family:var(--font-display); font-size:15px; font-weight:700; line-height:1.3;}
  .item-sub{font-size:12.5px; color:var(--muted); line-height:1.45;}
  .item-foot{margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:8px;}
  .price-stub{display:flex; flex-direction:column; font-family:var(--font-mono);}
  .price-now{font-size:22px; font-weight:700; color:var(--saffron); line-height:1.1;}
  .price-was{font-size:12.5px; color:var(--muted); text-decoration:line-through;}
  .buy-btn{
    background:var(--saffron); color:#221900; font-weight:700; font-size:13px;
    padding:9px 16px; border-radius:9px;
  }
  .buy-btn:hover{filter:brightness(1.08);}
  .buy-btn.owned{background:var(--success); color:#052013;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(8,9,20,0.72); backdrop-filter:blur(3px);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .overlay.open{display:flex;}
  @media (min-width:640px){ .overlay{align-items:center;} }
  .modal{
    background:var(--bg-alt); border:1px solid var(--line); width:100%; max-width:440px;
    border-radius:20px 20px 0 0; padding:22px 20px 26px; max-height:88vh; overflow-y:auto;
  }
  @media (min-width:640px){ .modal{border-radius:20px;} }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal-head h3{font-family:var(--font-display); font-size:17px; font-weight:700;}
  .close-x{width:30px; height:30px; border-radius:8px; background:var(--surface); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:16px;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .field input, .field textarea, .field select{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:9px; font-size:14px; font-family:inherit;
  }
  .field input:focus, .field textarea:focus{border-color:var(--saffron);}

  .pay-row{display:flex; justify-content:space-between; padding:9px 0; font-size:13.5px; border-bottom:1px dashed var(--line);}
  .pay-row.total{font-weight:700; font-size:15px; border-bottom:none; padding-top:12px;}
  .upi-options{display:flex; gap:8px; margin:14px 0;}
  .upi-chip{flex:1; text-align:center; padding:10px 6px; border-radius:10px; background:var(--surface); border:1px solid var(--line); font-size:12px; color:var(--muted);}
  .upi-chip.active{border-color:var(--saffron); color:var(--saffron); background:var(--saffron-dim);}
  .pay-btn{
    width:100%; background:var(--saffron); color:#221900; font-weight:700; font-size:14.5px;
    padding:13px; border-radius:11px; margin-top:14px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .pay-btn:disabled{opacity:0.6;}
  .note{font-size:11px; color:var(--muted); text-align:center; margin-top:10px; line-height:1.5;}

  .success-icon{
    width:64px; height:64px; border-radius:50%; background:var(--teal-dim); color:var(--teal);
    display:flex; align-items:center; justify-content:center; font-size:30px; margin:6px auto 14px;
  }
  .success-title{font-family:var(--font-display); font-size:18px; font-weight:700; text-align:center; margin-bottom:6px;}
  .success-sub{font-size:13px; color:var(--muted); text-align:center; margin-bottom:20px;}
  .tg-btn{
    width:100%; background:#229ED9; color:#fff; font-weight:700; font-size:14.5px;
    padding:13px; border-radius:11px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .pdf-frame{width:100%; height:60vh; border-radius:10px; border:1px solid var(--line); margin-top:10px; background:#0b0c1a;}
  .reader-gallery{width:100%; margin-top:10px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff;}
  .reader-gallery .poster-gallery{height:65vh; min-height:360px;}
  .reader-gallery .poster-slide img{object-fit:contain;}

  /* ---------- Admin ---------- */
  .admin-list{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .admin-row{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px;}
  .admin-row-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .admin-row-head strong{font-size:13.5px;}
  .admin-del{color:var(--danger); font-size:12px; font-weight:600;}
  .tab-row{display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:3px; scrollbar-width:thin;}
  .tab-btn{flex:0 0 auto; min-width:82px; padding:9px 11px; border-radius:9px; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-size:13px; font-weight:600; white-space:nowrap;}

// fsGetDoc is allowed to throw (offline/network error) so callers can tell
// "document doesn't exist" apart from "couldn't reach the server".
async function fsGetDoc(collection, id){
  const read=db.collection(collection).doc(id).get();
  const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('Firestore read timeout')),8000));
  const snap = await Promise.race([read,timeout]);
  return snap.exists ? snap.data() : null;
}
async function fsSetDoc(collection, id, data){
  try{
    const write=db.collection(collection).doc(id).set(data);
    const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('Firestore write timeout')),10000));
    await Promise.race([write,timeout]);
    return true;
  }catch(e){
    console.error(`Firestore write failed: ${collection}/${id}`,e);
    return false;
  }
}
async function fsDeleteDoc(collection, id){

  catch(e){ return false; }
}

/* ============ IndexedDB (primary store) ============
   localStorage caps out around 5MB per site. Poster images are stored as
   base64 text, so a handful of books with photos was enough to hit that
   wall — saves after that point failed silently. IndexedDB has a much
   larger quota (typically hundreds of MB+) and is the right tool for
   storing images, so it's now the primary store; localStorage is only
   used for small session bits. */
const IDB_NAME = 'ACB_DB';
const IDB_STORE = 'kv';
let idbOpenPromise = null;
function idbOpen(){
  if(idbOpenPromise) return idbOpenPromise;
  idbOpenPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return idbOpenPromise;
}
async function idbGet(key){
  try{
    const db = await idbOpen();
    return await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const rq = tx.objectStore(IDB_STORE).get(key);
      rq.onsuccess = ()=> resolve(rq.result === undefined ? null : rq.result);
      rq.onerror = ()=> reject(rq.error);
    });
  }catch(e){ return null; }
}
async function idbSet(key, value){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
    return true;
  }catch(e){ return false; }
}
async function idbDelete(key){
  try{
    const db = await idbOpen();
    await new Promise((resolve, reject)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
    return true;
  }catch(e){ return false; }
}

/* ============ Storage helpers (small session data only) ============ */
function localRead(key, fallback){
  try{
    const raw = localStorage.getItem("ACB_" + key);
    return raw === null ? fallback : JSON.parse(raw);
  }catch(e){ return fallback; }
}

function localWrite(key, value){
  try{
    localStorage.setItem("ACB_" + key, JSON.stringify(value));
    return true;
  }catch(e){ return false; }
}

/* Each book/batch's poster images are stored under their own key
   (poster:<kind>:<id>) separate from the small text list (title, price,
   etc). This way editing one book's title, or uploading one poster,
   only touches that book's data — not the whole catalog — so saving
   stays fast even with 30-40+ books full of images. */
function stripImages(items){
  return items.map(({imgs, img, telegram, pdfUrl, ...rest}) => rest);
}
function privateAccessFields(items){
  return items.map(({id,telegram,pdfUrl})=>({id,telegram:telegram||'',pdfUrl:pdfUrl||''}));
}
function attachImages(items, imageMap){
  return items.map(it => {
    const imgs = imageMap[it.id] || [];
    return { ...it, imgs, img: imgs[0] || '' };
  });
}
async function loadImagesFor(kind, items){
  const map = {};
  // Fetch every item's poster in parallel instead of one-at-a-time —
  // a serial loop here was the main cause of the long blank-screen wait
  // on load (each item added a full network round trip before anything
  // rendered).
  await Promise.all(items.map(async it=>{
    try{
      const doc = await fsGetDoc('posters', `${kind}_${it.id}`);
      if(doc && doc.imgs && doc.imgs.length){
        map[it.id] = doc.imgs;
        await idbSet(`poster:${kind}:${it.id}`, doc.imgs);
        return;
      }
    }catch(e){ /* offline — fall through to local cache below */ }
    const cached = await idbGet(`poster:${kind}:${it.id}`);
    if(cached && cached.length) map[it.id] = cached;
  }));
  return map;
}

async function loadCatalog(){
  let batchesMeta = null, booksMeta = null, reachable = true;
  try{
    const [bDoc, kDoc] = await Promise.all([fsGetDoc('catalog','batches'), fsGetDoc('catalog','books')]);
    batchesMeta = bDoc ? bDoc.items.map(({telegram,pdfUrl,...safe})=>safe) : null;
    booksMeta = kDoc ? kDoc.items.map(({telegram,pdfUrl,...safe})=>safe) : null;
  }catch(e){ reachable = false; }

  if(!reachable){
    // No internet right now — show whatever this device last saw, so the
    // site still opens (read-only) instead of a blank page.
    batchesMeta = await idbGet('catalog:batches:list') || [];
    booksMeta = await idbGet('catalog:books:list') || [];
    showToast('⚠️ Offline — showing last saved catalog');
  } else if(batchesMeta === null || booksMeta === null){
    // Genuinely first time this database has been used. One-time migration:
    // pull in whatever this specific device already had saved locally
    // (from before every device shared one database) so nothing already
    // uploaded gets lost, then push it up to the shared database.
    let legacyBatches = batchesMeta === null ? await idbGet('catalog:batches:list') : null;
    let legacyBooks = booksMeta === null ? await idbGet('catalog:books:list') : null;
    if(legacyBatches === null) legacyBatches = await idbGet('catalog:batches');
    if(legacyBooks === null) legacyBooks = await idbGet('catalog:books');
    if(legacyBatches === null) legacyBatches = localRead("catalog:batches", null);
    if(legacyBooks === null) legacyBooks = localRead("catalog:books", null);
    if(legacyBatches === null) legacyBatches = SEED_BATCHES;
    if(legacyBooks === null) legacyBooks = SEED_BOOKS;

    for(const it of legacyBatches){
      const inline = Array.isArray(it.imgs) ? it.imgs.filter(Boolean) : (it.img ? [it.img] : []);
      const local = await idbGet(`poster:batches:${it.id}`);
      const imgs = (local && local.length) ? local : inline;
      if(imgs.length) await fsSetDoc('posters', `batches_${it.id}`, {imgs});
    }
    for(const it of legacyBooks){
      const inline = Array.isArray(it.imgs) ? it.imgs.filter(Boolean) : (it.img ? [it.img] : []);
      const local = await idbGet(`poster:books:${it.id}`);
      const imgs = (local && local.length) ? local : inline;
      if(imgs.length) await fsSetDoc('posters', `books_${it.id}`, {imgs});
    }

    batchesMeta = stripImages(legacyBatches);
    booksMeta = stripImages(legacyBooks);
    await fsSetDoc('catalog','batches',{items:batchesMeta});
    await fsSetDoc('catalog','books',{items:booksMeta});
  }

  await idbSet('catalog:batches:list', batchesMeta);
  await idbSet('catalog:books:list', booksMeta);

  // Paint text/catalog immediately. Posters are secondary and must never
  // hold the entire page blank while every image is fetched.
  state.batches = attachImages(batchesMeta, {});
  state.books = attachImages(booksMeta, {});
  if(typeof app!=='undefined' && app) render();

  const [batchImages, bookImages] = await Promise.all([
    loadImagesFor('batches', batchesMeta),
    loadImagesFor('books', booksMeta)
  ]);
  state.batches = attachImages(batchesMeta, batchImages);
  state.books = attachImages(booksMeta, bookImages);
  if(typeof app!=='undefined' && app) render();
}

async function saveCatalog(){
  const publicB=stripImages(state.batches), publicK=stripImages(state.books);
  const okB = await fsSetDoc('catalog','batches',{items:publicB});

  const privateDocs=[...state.batches.map(it=>({kind:'batches',it})),...state.books.map(it=>({kind:'books',it}))];

    if(!ok) privateOk=false;

  if(!privateOk){
    showToast('⚠️ Telegram/PDF could not be saved — check Firebase admin permission');
    return false;
  }
  await idbSet('catalog:batches:list', publicB);
  await idbSet('catalog:books:list', publicK);
  return true;
}

/* ============ Site settings (admin-customizable "How to buy" options) ============ */
function emptySiteOptions(){ return [0,1,2,3,4].map(()=>({title:'',youtubeLink:''})); }
function normalizeSiteDoc(doc){
  // Supports the current {options:[...]} shape and migrates the old
  // single {title, youtubeLink} shape (pre 5-option update) into option 1.
  if(!doc) return {options: emptySiteOptions()};
  if(Array.isArray(doc.options)){
    const opts = emptySiteOptions();
    for(let i=0;i<5;i++){ if(doc.options[i]) opts[i] = {title: doc.options[i].title||'', youtubeLink: doc.options[i].youtubeLink||''}; }
    return {options: opts};
  }
  if(doc.title || doc.youtubeLink){
    const opts = emptySiteOptions();
    opts[0] = {title: doc.title||'', youtubeLink: doc.youtubeLink||''};
    return {options: opts};
  }
  return {options: emptySiteOptions()};
}
async function loadSiteSettings(){

    const doc = await fsGetDoc('settings','site');
    if(doc){ state.site = normalizeSiteDoc(doc); await idbSet('site:settings', state.site); return; }
  }catch(e){ console.warn('Could not load How-to-buy settings from Firebase:', e); /* fall through to cache */ }
  const cached = await idbGet('site:settings');

}

      ? '⚠️ Admin permission denied. Sign in with the configured admin email.'
      : '⚠️ Save failed — check Firebase connection and try again.';
    showToast(msg);
    return false;
  }
}
// Accepts a full YouTube URL (watch, youtu.be, shorts, or embed) and returns
// an embeddable player URL, or '' if the link isn't a recognizable YouTube link.
function youtubeEmbedUrl(link){
  if(!link) return '';
  try{
    const u = new URL(String(link).trim());
    const host = u.hostname.toLowerCase().replace(/^www\./,'');
    let id = '';
    if(host === 'youtu.be') id = u.pathname.replace(/^\//,'').split('/')[0];
    else if(host === 'youtube.com' || host === 'm.youtube.com'){
      if(u.pathname === '/watch') id = u.searchParams.get('v') || '';
      else if(u.pathname.startsWith('/embed/')) id = u.pathname.split('/')[2] || '';
      else if(u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2] || '';
    }
    return /^[A-Za-z0-9_-]{6,}$/.test(id) ? `https://www.youtube.com/embed/${id}` : '';
  }catch(e){ return ''; }
}

  await idbSet(`poster:${kind}:${id}`, imgs);

}

    state.purchases[email] = doc ? (doc.items||{}) : {};
    await idbSet('my:purchases:v2', state.purchases);
  }catch(e){
    const cached = await idbGet('my:purchases:v2');
    state.purchases[email] = (cached && cached[email]) ? cached[email] : {};
  }
  if(typeof app!=='undefined' && app) render();
}

/* ============ Firebase Authentication ============ */
function normalizeEmail(v){ return String(v||'').trim().toLowerCase(); }
async function saveProfile(user, data){
  await db.collection('users').doc(user.uid).set({
    uid:user.uid, email:user.email, name:data.name||'', mobile:data.mobile||'', updatedAt:Date.now(), createdAt:data.createdAt||Date.now()
  }, {merge:true});
}
async function getProfile(user){
  try{
    const d=await db.collection('users').doc(user.uid).get();
    return d.exists ? d.data() : {};
  }catch(e){ return {}; }
}
function refreshAccountButton(){
  const b=document.getElementById('accountBtn'); if(!b) return;
  if(currentUser){
    b.textContent='👤 '+(currentUser.name||currentUser.email.split('@')[0]);
    b.classList.add('logged'); b.disabled=false; b.setAttribute('aria-label','Open account');
  } else if(!authReady){
    b.textContent='Checking session…'; b.classList.remove('logged'); b.disabled=true;
  } else {
    b.textContent='Login / Sign up'; b.classList.remove('logged'); b.disabled=false; b.setAttribute('aria-label','Login or sign up');
  }
}
function setAuthMode(mode){authMode=mode; renderAuthBody();}
function openAuth(){
  if(!authReady) return showToast('Please wait — checking your login session');
  if(currentUser){
    document.getElementById('authTitle').textContent='My Account';
    document.getElementById('loginTab').classList.remove('active'); document.getElementById('signupTab').classList.remove('active');
    document.getElementById('authBody').innerHTML=`<div class="success-icon">✓</div><div class="success-title">${escapeHtml(currentUser.name||'Account')}</div><div class="success-sub">${escapeHtml(currentUser.email)}</div><button class="pay-btn" onclick="logoutUser()">Logout</button>`;
  } else {authMode='login'; renderAuthBody();}
  document.getElementById('authOverlay').classList.add('open');
}
function renderAuthBody(){
  document.getElementById('authTitle').textContent=authMode==='login'?'Login':'Create account';
  document.getElementById('loginTab').classList.toggle('active',authMode==='login');
  document.getElementById('signupTab').classList.toggle('active',authMode==='signup');
  document.getElementById('authBody').innerHTML = authMode==='login' ? `
    <div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="Enter password"></div>
    <button class="pay-btn" onclick="loginUser()">Login</button>
    <button class="link-btn" style="margin-top:10px;background:none;border:0;color:var(--teal);cursor:pointer" onclick="resetPassword()">Forgot password?</button>
    <div class="auth-help">Your login is securely handled by Firebase Authentication.</div>` : `
    <div class="field"><label>Name</label><input id="authName" type="text" autocomplete="name" placeholder="Your name"></div>
    <div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>Mobile (optional)</label><input id="authMobile" type="tel" autocomplete="tel" placeholder="10-digit mobile"></div>
    <div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="new-password" placeholder="Create a password (6+ characters)"></div>
    <button class="pay-btn" onclick="signupUser()">Create account</button>
    <div class="auth-help">No purchase is granted just by signing up.</div>`;
}
async function signupUser(){
  const name=(document.getElementById('authName')?.value||'').trim();
  const email=normalizeEmail(document.getElementById('authEmail')?.value);
  const mobile=(document.getElementById('authMobile')?.value||'').trim();
  const password=document.getElementById('authPassword')?.value||'';
  if(!name) return showToast('Enter your name');
  if(!email || !email.includes('@')) return showToast('Enter a valid email');
  if(password.length<6) return showToast('Password must be at least 6 characters');
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,password);
    await saveProfile(cred.user,{name,mobile,createdAt:Date.now()});
    currentUser={uid:cred.user.uid,email:cred.user.email,name,mobile};
    refreshAccountButton(); render();
    closeModal('authOverlay');
    showToast('Account created successfully');
  }catch(e){
    console.error(e);
    const msg=e.code==='auth/email-already-in-use'?'Account already exists. Please login.':(e.code==='auth/operation-not-allowed'?'Email/password login is not enabled in Firebase yet. (Firebase Console → Authentication → Sign-in method → enable Email/Password)':(e.code==='auth/unauthorized-domain'?'This website domain is not authorized in Firebase Console → Authentication → Settings → Authorized domains.':(e.code==='auth/weak-password'?'Password is too weak — use at least 6 characters.':e.message||'Could not create account')));
    showToast('⚠️ '+msg);
  }
}
async function loginUser(){
  const email=normalizeEmail(document.getElementById('authEmail')?.value);
  const password=document.getElementById('authPassword')?.value||'';
  if(!email || !password) return showToast('Enter email and password');
  try{
    const cred=await auth.signInWithEmailAndPassword(email,password);
    const profile=await getProfile(cred.user);
    currentUser={uid:cred.user.uid,email:cred.user.email,name:profile.name||cred.user.displayName||cred.user.email.split('@')[0],mobile:profile.mobile||''};
    refreshAccountButton(); render();
    closeModal('authOverlay'); showToast('Login successful');
  }catch(e){
    console.error(e);
    const msg=(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential'||e.code==='auth/wrong-password')?'Wrong email or password':(e.code==='auth/unauthorized-domain'?'This website domain is not authorized in Firebase Console → Authentication → Settings → Authorized domains.':(e.code==='auth/operation-not-allowed'?'Email/password login is not enabled in Firebase yet.':e.message||'Login failed'));
    showToast('⚠️ '+msg);
  }
}
async function resetPassword(){
  const email=normalizeEmail(document.getElementById('authEmail')?.value);
  if(!email || !email.includes('@')) return showToast('Enter your email first');
  try{ await firebase.auth().sendPasswordResetEmail(email); showToast('Password reset email sent'); }
  catch(e){ showToast('⚠️ Could not send reset email'); }
}
async function logoutUser(){ await auth.signOut(); currentUser=null; refreshAccountButton(); closeModal('authOverlay'); render(); showToast('Logged out'); }

function posterGallery(it, mini=false, kind=''){
  const imgs = getPosterImages(it);
  const baseCls = mini ? 'mini-banner' : 'item-banner';
  const cls = kind ? `${baseCls} kind-${kind}` : baseCls;
  if(!imgs.length){
    return `<div class="${cls}" style="background:${it.color}">${escapeHtml(it.title)}</div>`;
  }

  return `
    <div class="${cls}" onclick="event.stopPropagation()" onpointerdown="event.stopPropagation()">
      <div class="poster-gallery" onscroll="updatePosterDots(this)">
        ${imgs.map((src,i)=>`
          <div class="poster-slide">
            <img src="${src}" alt="${escapeHtml(it.title)} poster ${i+1}" loading="lazy" decoding="async">
          </div>
        `).join('')}
      </div>
      ${imgs.length>1 ? `<div class="poster-dots">${imgs.map((_,i)=>`<span class="poster-dot ${i===0?'active':''}"></span>`).join('')}</div>` : ''}
    </div>
  `;
}

function escapeHtml(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }
// The dots under a poster gallery only reflected slide 1 even after swiping
// to a later image. Recompute which slide is centered from scroll position
// and keep the matching dot highlighted.
function updatePosterDots(galleryEl){
  const dotsWrap = galleryEl.nextElementSibling;
  if(!dotsWrap || !dotsWrap.classList.contains('poster-dots')) return;
  const idx = Math.round(galleryEl.scrollLeft / galleryEl.clientWidth);

async function startPayment(kind,id){

  try{

    const res=await fetch(`${API_BASE}/create-order`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({kind,id})});
    let order; try{ order=await res.json(); }catch(_){ throw new Error('Payment server did not respond correctly — is this site deployed on Netlify with functions enabled?'); }
    if(!res.ok){ const msg=order.error||'Could not create payment order'; if(/Razorpay Key ID\/Key Secret are not configured/i.test(msg)) throw new Error('Razorpay keys are not loaded in this Netlify deployment. After saving the Netlify variables, trigger a new Deploy/Publish and try again.'); throw new Error(msg); }
    if(!order.orderId||!order.keyId) throw new Error('Razorpay order was not created — check Razorpay Key ID/Key Secret in Netlify environment variables.');
    if(!window.Razorpay) throw new Error('Razorpay Checkout could not load — check your internet connection or browser blocker.');
    const options={
      key:order.keyId,
      amount:order.amount,
      currency:order.currency||'INR',
      name:'All Competition Breaker',
      description:order.description||order.name||'ACB purchase',
      order_id:order.orderId,
      prefill:{name:currentUser.name||'',email:currentUser.email||'',contact:currentUser.mobile||''},
      notes:{kind,id},
      theme:{color:'#F0A93E'},
      handler:async function(response){ await handleRazorpaySuccess(response,kind,id); },
      modal:{ondismiss:function(){ if(btn){btn.disabled=false;btn.textContent=`Pay ₹${item.price} securely`;} }}
    };
    const rzp=new Razorpay(options);
    rzp.on('payment.failed',function(response){
      console.error('Razorpay payment failed',response);
      showToast('⚠️ Payment failed. Please try again.');
      if(btn){btn.disabled=false;btn.textContent=`Pay ₹${item.price} securely`;}
    });
    rzp.open();
  }catch(e){console.error(e);showToast('⚠️ '+(e.message||'Could not start payment'));if(btn){btn.disabled=false;btn.textContent=`Pay ₹${item.price} securely`;}}
}
async function handleRazorpaySuccess(response,kind,id){

    showToast('Verifying Razorpay payment…');

    const res=await fetch(`${API_BASE}/verify-payment`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({
      orderId:response.razorpay_order_id,
      paymentId:response.razorpay_payment_id,

async function loadAdminData(){
  if(!isAdmin()) return;
  // Load private Telegram/PDF fields for every item at once (instead of one
  // request at a time, which was slow) and fall back to the last-known-good
  // cached copy if a fetch fails — this is what stops a temporary network
  // hiccup from showing a blank Telegram field, which could otherwise get
  // saved over the real link and delete it.
  await Promise.all(['batches','books'].flatMap(kind =>
    (state[kind]||[]).map(async it => {
      const cacheKey = `private:${kind}:${it.id}`;
      try{
        const d = await fsGetDoc('privateCatalog', `${kind}_${it.id}`);
        if(d){
          it.telegram = d.telegram || '';
          it.pdfUrl = d.pdfUrl || '';
          it._telegramLoaded = true;
          await idbSet(cacheKey, {telegram: it.telegram, pdfUrl: it.pdfUrl});
        } else {
          it._telegramLoaded = true; // confirmed: nothing saved yet for this item
        }
      }catch(e){
        const cached = await idbGet(cacheKey);
        if(cached){
          it.telegram = cached.telegram || '';
          it.pdfUrl = cached.pdfUrl || '';
          it._telegramLoaded = true; // showing last-known-good value, safe to save
        } else {
          it._telegramLoaded = false; // could not confirm the real value — block overwriting it
        }
      }
    })
  ));
  try{ state.messages = await loadAllMessages(); }catch(e){ showToast('⚠️ Could not load support messages'); }
  try{
    const snap=await db.collection('purchases').get();
    state.allPurchases={};
    snap.forEach(d=>{state.allPurchases[d.id]=d.data().items||{};});
  }catch(e){ showToast('⚠️ Could not load purchase records'); }
  try{
    const snap=await db.collection('purchaseRequests').where('status','==','pending').get();
    state.pendingRequests=[]; snap.forEach(d=>state.pendingRequests.push({id:d.id,...d.data()}));
    state.pendingRequests.sort((a,b)=>(b.at||0)-(a.at||0));
  }catch(e){ state.pendingRequests=[]; showToast('⚠️ Could not load pending payments'); }
}

// Resizes an image file down to a max width and re-encodes it as a
// compressed JPEG. This keeps poster images small (usually well under
// 150 KB instead of multiple MB), so pages load faster and use far less
// memory on the visitor's device.
function compressImageFile(file, maxWidth=800, quality=0.72){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=reject;
    r.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        const scale=Math.min(1, maxWidth/img.width);
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src=String(r.result);
    };
    r.readAsDataURL(file);
  });
}

async function saveAdminItem(kind,id){
  if(!isAdmin()) return showToast('⚠️ Admin account required');
  const it=findItem(kind,id);
  if(!it) return showToast('⚠️ Item not found');
  const telegram=readAdminField(kind,id,'telegram');
  const pdfUrl=kind==='books' ? readAdminField(kind,id,'pdf') : '';
  if(telegram && !/^https?:\/\/t\.me\//i.test(telegram)){
    return showToast('⚠️ Telegram link should start with https://t.me/');
  }
  // Safety check: if this item's real Telegram/PDF value never successfully
  // loaded (e.g. a network hiccup), refuse to save a blank field over it —
  // that would silently delete the link every buyer of this item needs.
  if(!telegram && !pdfUrl && it._telegramLoaded===false){
    return showToast('⚠️ Could not confirm the current Telegram link — please close and reopen this item before saving, so nothing gets deleted by mistake.');
  }
  const title=readAdminField(kind,id,'title');
  const tag=readAdminField(kind,id,'tag');
  const sub=readAdminField(kind,id,'sub');
  const price=Math.max(0,Number(readAdminField(kind,id,'price'))||0);
  const mrp=Math.max(0,Number(readAdminField(kind,id,'mrp'))||0);
  it.title=title; it.tag=tag; it.sub=sub; it.price=price; it.mrp=mrp; it.telegram=telegram;
  if(kind==='books') it.pdfUrl=pdfUrl;

  // Save the sensitive access link through the Netlify server using the
  // Firebase Admin SDK. This avoids client-side Firestore-rule failures and
  // makes the link persist reliably in privateCatalog for paid access.
  try{
    const token=await currentUser.getIdToken(true);
    const res=await fetch(`${API_BASE}/admin-save-item`,{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({kind,id,title,tag,sub,price,mrp,telegram,pdfUrl})
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||`Server save failed (${res.status})`);
  }catch(e){
    console.error(e);
    showToast('⚠️ Telegram save failed — '+(e.message||'please try again'));
    return false;
  }

  // Confirm the private record can be read back by the admin client too.
  try{
    const verified=await fsGetDoc('privateCatalog',`${kind}_${id}`);
    if(!verified || (verified.telegram||'')!==telegram || (verified.pdfUrl||'')!==pdfUrl){
      showToast('⚠️ Save was sent but could not be verified yet');
      return false;
    }
  }catch(e){
    // Server save already succeeded; don't report a false failure merely
    // because a client-side Firestore read is temporarily unavailable.
  }
  await idbSet(`catalog:${kind}:list`,kind==='batches'?stripImages(state.batches):stripImages(state.books));
  showToast('✓ Telegram link & details saved');
  return true;
}

async function saveAdmin(){
  if(!isAdmin()) return showToast('⚠️ Admin account required');
  if(!['batches','books'].includes(adminTab)) return;
  const kind=adminTab;
  for(const it of state[kind]){
    it.title=readAdminField(kind,it.id,'title');
    it.tag=readAdminField(kind,it.id,'tag');
    it.sub=readAdminField(kind,it.id,'sub');
    it.price=Math.max(0,Number(readAdminField(kind,it.id,'price'))||0);
    it.mrp=Math.max(0,Number(readAdminField(kind,it.id,'mrp'))||0);
    it.telegram=readAdminField(kind,it.id,'telegram');
    if(kind==='books') it.pdfUrl=readAdminField(kind,it.id,'pdf');
  }
  const ok=await saveCatalog();
  if(ok){
    showToast(`${kind==='batches'?'Batches':'Books'} saved successfully`);
    await renderAdminEditor();
    render();
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

async function handleRazorpayReturn(){
  // Standard Razorpay Checkout uses the handler callback above. This function
  // also recovers a purchase if a user returns to the page after a transient
  // browser/network interruption and the payment is already recorded.
  const params=new URLSearchParams(location.search);
  const orderId=params.get('razorpay_order_id'),paymentId=params.get('razorpay_payment_id'),signature=params.get('razorpay_signature');
  if(!orderId||!paymentId||!signature||!currentUser) return;
  try{
    const token=await firebase.auth().currentUser.getIdToken(true);
    const res=await fetch(`${API_BASE}/verify-payment`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({orderId,paymentId,signature})});
    if(!res.ok) return;
    await loadMyPurchases(currentUser.email);
    const saved=await db.collection('orders').doc(orderId).get();
    const o=saved.exists?saved.data():{};
    if(o.kind&&o.itemId) showSuccess(o.kind,o.itemId,true,false);
    history.replaceState({},document.title,location.pathname);
  }catch(e){console.error(e);}
}

/* ============ Init ============ */
(async function init(){
  // Render a visible loading state first; never leave the middle of the page
  // as an unexplained blank area while Firebase/network requests are pending.
  refreshAccountButton();

  // Catalog/settings are independent, so don't make one slow request block
  // the other. loadCatalog itself paints the catalog before poster downloads.
  await loadCatalog();
  render();

  auth.onAuthStateChanged(async user=>{
    try{
      if(user){
        // Show the account as logged in immediately using data Firebase Auth
        // already has, instead of waiting on a Firestore read first — the
        // profile fetch below only upgrades the display name once it's back.
        currentUser={uid:user.uid,email:user.email,name:user.displayName||user.email.split('@')[0],mobile:''};
        refreshAccountButton();
        render();
        const profile=await getProfile(user);
        currentUser={uid:user.uid,email:user.email,name:profile.name||user.displayName||user.email.split('@')[0],mobile:profile.mobile||''};
        refreshAccountButton();
        render();
        await loadMyPurchases(user.email);
        refreshAccountButton();
        render();
        await handleRazorpayReturn();
      }else{
        currentUser=null;
        state.purchases={};
        refreshAccountButton();
        render();
      }
    }catch(e){
      console.error('Auth state handling failed:',e);
      currentUser=null;
      refreshAccountButton();
      render();
    }finally{
      authReady=true;
      refreshAccountButton();
    }
  }, err=>{
    console.error('Firebase Auth listener error:',err);
    authReady=true;
    refreshAccountButton();
    showToast('⚠️ Login service could not initialize');
  });
})();
</script>
